{% extends 'trasy/base.html' %}

{% block title %}
Add List page
{% endblock %}


{% block list %} 
    <h1>Add new list here:</h1>
    <p class="page-intro">Create a named point collection with a background image you can mark up later.</p>
    <form method="post" enctype="multipart/form-data" action="{% url 'addList' %}" class="form-send">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" name="Save" class="blue-button">Add List</button>
    </form>
{% endblock%}
